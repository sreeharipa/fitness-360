<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f13" />
    <meta name="description" content="Fitness 360: tap any muscle on a 3D body to see exercises with animated 3D demos." />
    <title>Fitness 360</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23d4ff3a' stroke-width='4'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-mode="explore">
    <div class="app">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Fitness 360 home"><span class="logo"></span>Fitness<b>360</b></a>
        <span class="badge">Anatomy view</span>
      </header>

      <main class="stage">
        <section id="viewer" class="viewer" aria-label="3D body viewer">
          <div id="loading" class="loading"><div class="spinner"></div><p>Loading anatomy…</p></div>
          <div class="overlay">
            <div class="seg small explore-only" id="viewToggle" role="group" aria-label="Camera view">
              <button data-view="front" class="on">Front</button>
              <button data-view="back">Back</button>
            </div>
            <p id="hint" class="hint explore-only">Drag to rotate · Pinch or scroll to zoom · Tap a muscle</p>
            <div id="demoHud" class="hud demo-only">
              <button class="icon" data-act="play" aria-label="Pause"></button>
              <div class="seg small">
                <button data-speed="0.5">0.5×</button>
                <button data-speed="1" class="on">1×</button>
                <button data-speed="1.5">1.5×</button>
              </div>
              <span class="rep">Rep 1</span>
              <button class="icon" data-act="cam" aria-label="Reset camera" title="Reset camera">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div id="tooltip" class="tooltip" role="status"></div>
        </section>

        <aside id="panel" class="panel">
          <button id="grabber" class="grabber" aria-label="Expand panel"><span></span></button>
          <div id="panelBody" class="panel-body"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
